name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Commit the regenerated report and charts to the branch that started the run
        type: boolean
        default: true

# Two runs on one branch would otherwise race on the final push.
concurrency:
  group: "benchmarks-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: Run Criterion benchmarks (comparison harness)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run benchmarks
        run: cargo bench --manifest-path tools/benchmarks/Cargo.toml

      - name: Generate benchmark summary and charts
        run: cargo run --release --manifest-path tools/benchmarks/Cargo.toml --bin report

      - name: Upload criterion reports
        uses: actions/upload-artifact@v7
        with:
          name: criterion-reports
          path: tools/benchmarks/target/criterion

      - name: Upload summary + charts
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-summary
          path: |
            BENCHMARKS.md
            assets/benchmarks

      # Path-limited staging keeps the commit to the generated files, so this
      # never touches workflow files or other sources. Pushes made with
      # GITHUB_TOKEN do not start new workflow runs, so the report commit does
      # not re-trigger CI.
      - name: Publish report to ${{ github.ref_name }}
        if: inputs.publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all -- BENCHMARKS.md assets/benchmarks

          if git diff --cached --quiet; then
            echo "The report is unchanged; nothing to publish."
            exit 0
          fi

          git commit -m "Update benchmark report" \
            -m "Generated by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          git push origin "HEAD:${{ github.ref_name }}"
