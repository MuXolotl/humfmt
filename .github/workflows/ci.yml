name: CI

on:
  push:
  pull_request:

# A branch that receives several pushes in a row only needs the newest verdict.
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo check
        run: cargo check --all-targets --all-features

      - name: Run tests
        run: cargo test --all-features --verbose

  release-mode:
    name: Test Suite (release)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Overflow checks and `debug_assert!` are compiled out here, so the
      # release profile takes different branches than the debug suite.
      - name: Run tests in release mode
        run: cargo test --release --all-features

  msrv:
    name: MSRV (1.70)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust 1.70
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.70"

      # Checks that the library itself compiles on MSRV.
      # Tests are not run here because dev-dependencies (criterion, proptest)
      # and optional ecosystem crates (chrono, time) pull in transitive
      # dependencies that require editions newer than what Rust 1.70 supports.
      # Correctness is covered by the Test Suite job on stable.
      - name: Check library on MSRV
        run: cargo check

  minimal:
    name: Minimal feature check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check no_std-compatible build
        run: cargo check --no-default-features

  feature-matrix:
    name: Feature matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default
            args: ""
          - label: no-default
            args: --no-default-features
          - label: std-only
            args: --no-default-features --features std
          - label: chrono
            args: --no-default-features --features chrono
          - label: time
            args: --no-default-features --features time
          - label: chrono-time
            args: --no-default-features --features chrono,time
          - label: all-features
            args: --all-features

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check ${{ matrix.label }}
        run: cargo check ${{ matrix.args }}

  targets:
    name: Cross targets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain with cross targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu,thumbv7em-none-eabi,wasm32-unknown-unknown

      # `usize` and `isize` are part of the input surface, and they are 32 bit here.
      - name: Check 32-bit build
        run: cargo check --all-features --target i686-unknown-linux-gnu

      # Bare embedded target: no `std`, no allocator, no OS.
      - name: Check no_std embedded build
        run: cargo check --no-default-features --target thumbv7em-none-eabi

      - name: Check wasm build
        run: cargo check --target wasm32-unknown-unknown

  fmt:
    name: Format check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # JSON output keeps the diagnostics machine-readable for the summary
      # below; the exit code of this step still decides whether the job passes.
      - name: Run clippy (strict mode)
        id: clippy
        run: cargo clippy --all-targets --all-features --message-format=json -- -D warnings > clippy.json

      # Reporting only: a failure here must not mask the lint result itself.
      - name: Summarise clippy findings
        if: always()
        continue-on-error: true
        env:
          CLIPPY_OUTCOME: ${{ steps.clippy.outcome }}
        run: |
          if [ ! -f clippy.json ]; then
            echo "### Clippy: the lint run produced no JSON output - see the step log" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          jq -r '
            select(.reason == "compiler-message")
            | .message
            | select(.level == "error" or .level == "warning")
            | [
                .level,
                (.code.code // "rustc"),
                (.spans[0].file_name // "unknown"),
                (.spans[0].line_start // 0),
                (.spans[0].column_start // 0),
                (.message | gsub("[\\n\\t]"; " "))
              ]
            | @tsv
          ' clippy.json | sort -u > lints.tsv

          count=$(wc -l < lints.tsv)

          if [ "$count" -eq 0 ]; then
            if [ "$CLIPPY_OUTCOME" = "success" ]; then
              echo "### Clippy: clean" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### Clippy: the lint run failed without emitting diagnostics - see the step log" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi

          {
            echo "### Clippy: $count diagnostic(s)"
            echo
            echo "| Level | Lint | Location | Message |"
            echo "|---|---|---|---|"
            while IFS=$'\t' read -r level lint file line col message; do
              echo "| $level | \`$lint\` | \`$file:$line\` | ${message//|/\\|} |"
            done < lints.tsv
          } >> "$GITHUB_STEP_SUMMARY"

          # Inline annotations, shown on the Checks tab of the commit.
          while IFS=$'\t' read -r level lint file line col message; do
            echo "::$level file=$file,line=$line,col=$col,title=${lint//::/-}::$message"
          done < lints.tsv

  docs:
    name: Documentation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The crate documents itself from `docs/CRATE.md`, so a broken
      # intra-doc link is a broken product page.
      - name: Build docs with warnings denied
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build docs without default features
        run: cargo doc --no-deps --no-default-features
        env:
          RUSTDOCFLAGS: -D warnings

  miri:
    name: Miri
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust nightly with miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      # Every formatter reaches the crate's only `unsafe` through `Display`:
      # the stack buffer hands out a `&str` built from bytes written as UTF-8.
      # The proptest and ecosystem-adapter suites stay out of this run because
      # they are far slower under Miri without touching that code.
      - name: Run the formatter tests under Miri
        run: |
          cargo miri test \
            --test golden \
            --test number_format \
            --test number_edge_cases \
            --test bytes_format \
            --test percent_format \
            --test duration_format \
            --test ago_format \
            --test ordinal_format \
            --test list_format \
            --test integer_paths \
            --test formatter_flags

  package:
    name: Package (publish dry run)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Packages the crate and builds the archive the way crates.io would,
      # which is also what proves the `include_str!` paths ship README.md and
      # docs/CRATE.md inside the published files.
      - name: Run cargo publish dry run
        run: cargo publish --dry-run
